# Static part of the pgBackRest config. Secrets and the repo target come from environment variables
# (PGBACKREST_REPO1_*), which pgBackRest reads natively. See .env.production.example.
[global]
# Cloudflare R2 repository (S3-compatible). Set via env in docker-compose.prod.yml:
#   PGBACKREST_REPO1_TYPE=s3
#   PGBACKREST_REPO1_S3_ENDPOINT=<ACCOUNT_ID>.r2.cloudflarestorage.com
#   PGBACKREST_REPO1_S3_BUCKET=yuktiops-pgbackrest
#   PGBACKREST_REPO1_S3_REGION=auto
#   PGBACKREST_REPO1_S3_KEY / _KEY_SECRET  (R2 API token scoped to that bucket only)
repo1-path=/yuktiops
repo1-s3-uri-style=path
repo1-retention-full=4
repo1-retention-diff=7
repo1-retention-archive-type=full
repo1-bundle=y
repo1-block=y
# Client-side encryption: the key never leaves our env, so R2 only sees ciphertext.
repo1-cipher-type=aes-256-cbc
compress-type=gz
compress-level=3
process-max=2
start-fast=y
delta=y
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest
archive-async=y
spool-path=/var/spool/pgbackrest

[yuktiops]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
