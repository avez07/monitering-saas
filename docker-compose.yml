services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      retries: 15
  redis:
    image: redis:7.4.1-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['object-data:/data']
    depends_on:
      storage-permissions: { condition: service_completed_successfully }
  buckets:
    image: amazon/aws-cli:2.24.6
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        until aws --endpoint-url http://s3:9000 s3api list-buckets >/dev/null 2>&1; do sleep 2; done
        for bucket in mimir mimir-ruler mimir-alertmanager loki tempo; do
          aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$bucket" >/dev/null 2>&1 || aws --endpoint-url http://s3:9000 s3api create-bucket --bucket "$$bucket"
        done
  storage-permissions:
    image: alpine:3.21
    command: ['sh', '-c', 'chown -R 10001:10001 /mimir /loki /tempo /objects']
    volumes: ['mimir-data:/mimir', 'loki-data:/loki', 'tempo-data:/tempo', 'object-data:/objects']
  mimir:
    image: grafana/mimir:2.17.0
    user: '10001:10001'
    working_dir: /data
    command: ['-config.file=/etc/mimir/config.yaml', '-config.expand-env=true']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: ['./infra/mimir.yaml:/etc/mimir/config.yaml:ro', 'mimir-data:/data']
    ports: ['127.0.0.1:9009:9009']
    depends_on:
      buckets: { condition: service_completed_successfully }
      storage-permissions: { condition: service_completed_successfully }
  loki:
    image: grafana/loki:3.4.2
    user: '10001:10001'
    command: ['-config.file=/etc/loki/config.yaml', '-config.expand-env=true']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: ['./infra/loki.yaml:/etc/loki/config.yaml:ro', 'loki-data:/data']
    ports: ['127.0.0.1:3100:3100']
    depends_on:
      buckets: { condition: service_completed_successfully }
      storage-permissions: { condition: service_completed_successfully }
  tempo:
    image: grafana/tempo:2.7.2
    user: '10001:10001'
    command: ['-config.file=/etc/tempo/config.yaml', '-config.expand-env=true']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes: ['./infra/tempo.yaml:/etc/tempo/config.yaml:ro', 'tempo-data:/data']
    ports: ['127.0.0.1:3200:3200', '127.0.0.1:4318:4318']
    depends_on:
      buckets: { condition: service_completed_successfully }
      storage-permissions: { condition: service_completed_successfully }
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ['127.0.0.1:3001:3000']
    volumes: ['grafana-data:/var/lib/grafana', './infra/grafana:/etc/grafana/provisioning:ro']
    depends_on: [mimir, loki, tempo]
  mailpit:
    image: axllent/mailpit:v1.24.1
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  app:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      NODE_ENV: development
      DEMO_MODE: 'false'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      MIMIR_URL: http://mimir:9009
      LOKI_URL: http://loki:3100
      TEMPO_URL: http://tempo:3200
      TEMPO_OTLP_URL: http://tempo:4318
      SMTP_HOST: mailpit
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mimir: { condition: service_started }
      loki: { condition: service_started }
      tempo: { condition: service_started }
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  object-data:
  mimir-data:
  loki-data:
  tempo-data:
  grafana-data:
