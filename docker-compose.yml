services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['yuktiops-postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      retries: 15
  redis:
    image: redis:7
    # AOF everysec; noeviction so queues/limiters are never silently dropped. Loopback only.
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['yuktiops-redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 15
  # OpenTelemetry storage (traces + logs). Loopback only. Pinned (25.8 LTS line).
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6-alpine
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-yuktiops}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-yuktiops_local_dummy}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports: ['127.0.0.1:8123:8123']
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: ['yuktiops-clickhouse-data:/var/lib/clickhouse']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping | grep -q Ok']
      interval: 5s
      retries: 15
  # Prometheus remote_write storage for the premium dashboard (docs/api/advanced-telemetry.md). Loopback only.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    command: ['-storageDataPath=/storage', '-retentionPeriod=30d', '-httpListenAddr=:8428', '-search.maxPointsPerTimeseries=11000']
    ports: ['127.0.0.1:8428:8428']
    volumes: ['yuktiops-vm-data:/storage']
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8428/health | grep -q OK']
      interval: 5s
      retries: 15
  # Optional transaction-mode PgBouncer (profile "pgbouncer"), to test the production connection path:
  #   docker compose --profile pgbouncer up -d pgbouncer
  #   DATABASE_URL=postgresql://USER:PASS@localhost:6432/DB?schema=public&pgbouncer=true&connection_limit=10
  # Migrations must keep using the direct URL (port 5432). Tests and `npm run dev` use Postgres directly.
  pgbouncer:
    profiles: [pgbouncer]
    image: edoburu/pgbouncer:v1.23.1-p3
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: '6432'
      MAX_CLIENT_CONN: '200'
      DEFAULT_POOL_SIZE: '20'
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports: ['127.0.0.1:6432:6432']
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-p', '6432']
      interval: 5s
      retries: 15
  mailpit:
    image: axllent/mailpit:v1.24.1
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  api:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      SMTP_HOST: mailpit
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_URL: http://clickhouse:8123
      VM_URL: http://victoriametrics:8428
    ports: ['127.0.0.1:${API_HOST_PORT:-4000}:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      retries: 12
    restart: unless-stopped
  worker:
    profiles: [app]
    build: .
    env_file: .env
    command: ['npm', 'run', 'worker']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      SMTP_HOST: mailpit
      REDIS_URL: redis://redis:6379/0
      CLICKHOUSE_URL: http://clickhouse:8123
      VM_URL: http://victoriametrics:8428
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped
  # Local agent (docker compose --profile agent up -d --build). Builds agent/Dockerfile from source, so no
  # ghcr.io pull is needed. Set YUKTIOPS_API_KEY (and optionally YUKTIOPS_API_URL) in .env or the shell.
  agent:
    profiles: [agent]
    build:
      context: ./agent
      dockerfile: Dockerfile
    image: ${YUKTIOPS_AGENT_IMAGE:-yuktiops-agent:local}
    container_name: yuktiops-agent
    restart: unless-stopped
    pid: host
    network_mode: host
    environment:
      YUKTIOPS_API_KEY: ${YUKTIOPS_API_KEY:-}
      YUKTIOPS_API_URL: ${YUKTIOPS_API_URL:-http://localhost:4000}
      HOST_ROOT: /host
    volumes:
      - yuktiops-agent:/var/lib/yuktiops
      - /:/host:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
volumes:
  yuktiops-agent:
  yuktiops-postgres-data:
  yuktiops-redis-data:
  yuktiops-clickhouse-data:
  yuktiops-vm-data:
