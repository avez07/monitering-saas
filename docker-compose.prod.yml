# Production stack for one Hetzner VM. Run from /opt/yuktiops with the env file next to this file:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Use deploy/deploy.sh for releases (migrations, health gate, rollback); see docs/ops.md.
name: yuktiops

x-app-env: &app-env
  NODE_ENV: production
  PORT: '4000'
  APP_URL: https://${APP_DOMAIN}
  API_PUBLIC_URL: https://${API_DOMAIN}
  TRUST_PROXY: ${TRUST_PROXY:-172.29.0.0/24}
  # The app talks to PgBouncer (transaction pooling). pgbouncer=true turns off prepared statements.
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}?schema=public&pgbouncer=true&connection_limit=${DB_POOL_SIZE:-10}&pool_timeout=20
  # Migrations (deploy.sh) go straight to Postgres, not through the pooler.
  DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  BULL_BOARD_USER: ${BULL_BOARD_USER:-}
  BULL_BOARD_PASSWORD: ${BULL_BOARD_PASSWORD:-}
  INGEST_MAX_WAITING: ${INGEST_MAX_WAITING:-50000}
  INGEST_MAX_LAG_SECONDS: ${INGEST_MAX_LAG_SECONDS:-60}
  BILLING_PROVIDER: ${BILLING_PROVIDER:-mock}
  BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:?set BILLING_WEBHOOK_SECRET}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  EMAIL_FROM: ${EMAIL_FROM:-alerts@yuktiops.com}
  SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-30000}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-yuktiops}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-yuktiops_otel}
  VM_URL: http://victoriametrics:8428
  PROM_MAX_SERIES_PER_ORG: ${PROM_MAX_SERIES_PER_ORG:-50000}

x-app-hardening: &app-hardening
  image: ${APP_IMAGE:-yuktiops-app}:${APP_TAG:-latest}
  build: { context: ., target: runtime }
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: ['/tmp:size=64m']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  logging: &logging
    driver: json-file
    options: { max-size: '20m', max-file: '5' }

services:
  web:
    image: ${WEB_IMAGE:-yuktiops-web}:${APP_TAG:-latest}
    build: { context: ., target: web }
    restart: unless-stopped
    init: true
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      OTLP_DOMAIN: ${OTLP_DOMAIN:-otlp.invalid}
      DOCS_DOMAIN: ${DOCS_DOMAIN:-docs.invalid}
      PROXY_ALLOW: ${PROXY_ALLOW:-172.29.0.0/24}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      api: { condition: service_healthy }
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    deploy:
      resources: { limits: { cpus: '1.0', memory: 256M } }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # Stateless: run as many replicas as the VM has CPU for (docs/ops.md "Scaling"). Caddy discovers the
  # replicas through Docker DNS (dynamic upstreams) and health-checks each one.
  api:
    <<: *app-hardening
    environment: *app-env
    networks: [edge, internal]
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources: { limits: { cpus: '1.5', memory: 768M } }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    # server.js stops accepting, drains, closes DB and Redis, within 10 s; Caddy stops routing on its health check.
    stop_grace_period: 20s

  # One service per worker role (backend/src/worker.js --role). Each has its own /healthz.
  worker-ingest: &worker
    <<: *app-hardening
    command: ['node', 'backend/src/worker.js', '--role=ingest']
    environment: *app-env
    # DB via internal; ingest never needs the internet.
    networks: [internal]
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: '1.5', memory: 768M } }
    healthcheck: &worker-health
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9105/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    # Workers finish the active job, then close (worker.js force-exits after 30 s).
    stop_grace_period: 40s

  worker-checks:
    <<: *worker
    command: ['node', 'backend/src/worker.js', '--role=checks']
    # Outbound uptime checks need the egress network.
    networks: [egress, internal]
    healthcheck:
      <<: *worker-health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9101/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  worker-alerts:
    <<: *worker
    command: ['node', 'backend/src/worker.js', '--role=alerts']
    healthcheck:
      <<: *worker-health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9102/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  worker-notify:
    <<: *worker
    command: ['node', 'backend/src/worker.js', '--role=notify']
    # Email, webhooks and Telegram go out through egress.
    networks: [egress, internal]
    healthcheck:
      <<: *worker-health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9103/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  worker-housekeeping:
    <<: *worker
    command: ['node', 'backend/src/worker.js', '--role=housekeeping']
    # Domain-expiry lookups (RDAP) need egress.
    networks: [egress, internal]
    healthcheck:
      <<: *worker-health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9104/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  # Transaction-mode pooler between the app and Postgres. The app opens many Prisma connections (api
  # replicas + 5 worker roles); Postgres sees at most DEFAULT_POOL_SIZE + reserve.
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p3
    init: true
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: '6432'
      MAX_CLIENT_CONN: '600'
      DEFAULT_POOL_SIZE: ${PGBOUNCER_POOL_SIZE:-40}
      RESERVE_POOL_SIZE: '5'
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources: { limits: { cpus: '0.5', memory: 128M } }
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-p', '6432']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:7
    init: true
    restart: unless-stopped
    # AOF everysec, noeviction, password; no published port (internal network only).
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      # RDB snapshot as well as the AOF: the file deploy/backup/redis-snapshot.sh ships to R2.
      - --save
      - '900 1 300 100'
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [internal]
    deploy:
      resources: { limits: { cpus: '1.0', memory: 512M } }
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # Worker for OTLP batches (decode, redact, sample, insert into ClickHouse). No internet access needed.
  worker-otel:
    <<: *worker
    command: ['node', 'backend/src/worker.js', '--role=otel']
    healthcheck:
      <<: *worker-health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:9106/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]

  # Trace and log storage. Internal network only, no published port; per-row TTL follows the plan.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6-alpine
    init: true
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-yuktiops}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    networks: [internal]
    deploy:
      resources: { limits: { cpus: '2.0', memory: 3G } }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8123/ping | grep -q Ok']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  # Prometheus remote_write storage (premium dashboard). Internal network only, no published port; reads are
  # always scoped by the API with extra_label=yk_org=<orgId>. Data ages out after 30 days.
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.106.1
    init: true
    restart: unless-stopped
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -httpListenAddr=:8428
      - -search.maxPointsPerTimeseries=11000
      - -search.maxQueryDuration=10s
    volumes:
      - vm-data:/storage
    networks: [internal]
    deploy:
      resources: { limits: { cpus: '1.5', memory: 1536M } }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8428/health | grep -q OK']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  db:
    image: ${DB_IMAGE:-yuktiops-db}:${DB_TAG:-pg16-ts2.17}
    build: { context: ./deploy/postgres }
    init: true
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      PGBACKREST_STANZA: yuktiops
      # The superuser is POSTGRES_USER (there is no role named postgres in this image setup).
      PGBACKREST_PG1_USER: ${POSTGRES_USER}
      PGBACKREST_REPO1_TYPE: ${BACKUP_REPO_TYPE:-s3}
      PGBACKREST_REPO1_S3_ENDPOINT: ${R2_ENDPOINT:-}
      PGBACKREST_REPO1_S3_BUCKET: ${R2_BUCKET:-}
      PGBACKREST_REPO1_S3_REGION: auto
      PGBACKREST_REPO1_S3_KEY: ${R2_ACCESS_KEY_ID:-}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${R2_SECRET_ACCESS_KEY:-}
      PGBACKREST_REPO1_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?set PGBACKREST_CIPHER_PASS}
    # WAL archiving to the repository; tuned for a 4 GB VM. Keep shared_buffers near 25% of the memory limit.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=yuktiops archive-push %p
      - -c
      - archive_timeout=60
      - -c
      - max_wal_size=2GB
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
      - -c
      - log_checkpoints=on
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - db-data:/var/lib/postgresql/data
      - pgbackrest-spool:/var/spool/pgbackrest
      - pgbackrest-log:/var/log/pgbackrest
    networks: [internal]
    deploy:
      resources: { limits: { cpus: '2.0', memory: 2G } }
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

networks:
  edge:
    # Fixed subnet so TRUST_PROXY can name exactly the proxy network.
    ipam: { config: [{ subnet: 172.29.0.0/24 }] }
  egress: {}
  # No route to the internet; only the database and its clients live here. The database publishes no port.
  internal:
    internal: true

volumes:
  db-data:
  redis-data:
  clickhouse-data:
  vm-data:
  pgbackrest-spool:
  pgbackrest-log:
  caddy-data:
  caddy-config:
